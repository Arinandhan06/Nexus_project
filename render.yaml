services:
  # Backend API Service (FastAPI)
  - type: web
    name: nexus-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "true"
      - key: MOCK_EXTERNALS
        value: "true"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://nexus-project-livid.vercel.app
      - key: GITHUB_CLIENT_ID
        value: Ov23liBNJ2cHPGunM61D
      - key: GITHUB_CLIENT_SECRET
        value: 64e733cd2b46cac807c7a086f57782713c426f86

  # Frontend Web Service (Static React SPA)
  - type: web
    name: nexus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nexus-backend
          property: host
